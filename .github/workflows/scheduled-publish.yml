# 예약 발행 (2026-11-09) — 매일 한국 시간 아침 6시쯤 실행
# 승인됐고 발행일이 된 글이 사이트에 아직 없으면 → 빈 커밋을 올려 Vercel이 사이트를 다시 만들게 함 → 공개 확인 후 IndexNow 알림
# 글 공개 조건 자체는 src/data/blog.js (approved: true + 발행일이 오늘이거나 지남)
name: 예약 발행
on:
  schedule:
    - cron: '0 21 * * *' # UTC 21시 = 한국 6시 (GitHub 사정으로 몇십 분 늦을 수 있음)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: check
        run: node scripts/scheduled-publish.mjs check
      - name: 사이트 다시 만들기 (빈 커밋)
        if: steps.check.outputs.count != '0'
        env:
          # Vercel은 커밋 작성자가 깃허브 계정(djjjang)이어야 배포함
          GIT_AUTHOR_NAME: djjjang
          GIT_AUTHOR_EMAIL: 327447624+djjjang@users.noreply.github.com
          GIT_COMMITTER_NAME: djjjang
          GIT_COMMITTER_EMAIL: 327447624+djjjang@users.noreply.github.com
        run: |
          git commit --allow-empty -m "예약 발행: ${{ steps.check.outputs.slugs }}"
          git push
      - name: 공개 확인 + IndexNow 알림
        if: steps.check.outputs.count != '0'
        run: node scripts/scheduled-publish.mjs notify ${{ steps.check.outputs.slugs }}

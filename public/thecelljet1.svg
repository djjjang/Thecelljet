<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none">
  <defs>
    <!-- Console Body Gradients -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F4F8" />
      <stop offset="100%" stop-color="#DEE4EB" />
    </linearGradient>
    <linearGradient id="bevelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0D7E1" />
    </linearGradient>
    <linearGradient id="screenBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD4DF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2532" />
      <stop offset="100%" stop-color="#131822" />
    </linearGradient>
    <linearGradient id="panelBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#273244" />
      <stop offset="100%" stop-color="#1E2635" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5D2" />
      <stop offset="100%" stop-color="#009688" />
    </linearGradient>
    <linearGradient id="blueBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#62B6FF" />
      <stop offset="100%" stop-color="#378FE6" />
    </linearGradient>
    <linearGradient id="metallicBtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Under-shadow -->
  <ellipse cx="550" cy="780" rx="430" ry="35" fill="#0F172A" opacity="0.14" filter="blur(14px)" />
  <ellipse cx="550" cy="775" rx="350" ry="20" fill="#0F172A" opacity="0.22" filter="blur(8px)" />

  <!-- === 1. MAIN CONSOLE HOUSING === -->
  <g filter="url(#dropShadow)">
    <!-- Base Outer Shell -->
    <path d="M 260 220 C 260 170, 310 160, 420 160 L 680 160 C 790 160, 840 170, 840 220 L 870 650 C 870 730, 810 760, 740 760 L 360 760 C 290 760, 230 730, 230 650 Z"
          fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="2" />

    <!-- Front Bezel Inner Recess Curve -->
    <path d="M 275 235 C 275 195, 320 185, 420 185 L 680 185 C 780 185, 825 195, 825 235 L 850 635 C 850 710, 800 735, 735 735 L 365 735 C 300 735, 250 710, 250 635 Z"
          fill="url(#bevelGrad)" opacity="0.5" />

    <!-- Screen Bezel Outer Frame -->
    <rect x="295" y="215" width="510" height="325" rx="26" fill="url(#screenBezel)" stroke="#BCC7D5" stroke-width="1.5" />
    <rect x="300" y="220" width="500" height="315" rx="22" fill="#111622" />
  </g>

  <!-- === 2. TOUCHSCREEN DISPLAY === -->
  <g>
    <!-- Screen Inner Background -->
    <rect x="305" y="225" width="490" height="305" rx="18" fill="url(#screenBg)" />

    <!-- Status Bar (Top) -->
    <rect x="305" y="225" width="490" height="30" rx="18" fill="#161E2B" />
    <!-- [sumi] mini logo in top left of screen -->
    <g transform="translate(325, 233) scale(0.65)">
      <rect x="0" y="0" width="36" height="20" rx="4" fill="none" stroke="#94A3B8" stroke-width="1.5" />
      <text x="18" y="14" text-anchor="middle" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">sumi</text>
    </g>
    <!-- Date & Temperature in top right of screen -->
    <text x="630" y="245" fill="#94A3B8" font-family="monospace" font-size="10.5">2025.12.18  5:09:53PM  22°C</text>
    <!-- Sun & Speaker icons -->
    <circle cx="755" cy="242" r="4" fill="none" stroke="#94A3B8" stroke-width="1.2" />
    <path d="M 770 240 L 775 237 L 775 247 L 770 244 Z" fill="#94A3B8" />

    <!-- LEFT PANEL: Treatment Area -->
    <g transform="translate(325, 268)">
      <text x="0" y="14" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="bold">Treatment Area</text>
      <text x="0" y="28" fill="#64748B" font-family="sans-serif" font-size="8.5">Select the area where you want Treatment.</text>

      <!-- 2x2 Grid Buttons -->
      <!-- 1. SPECIAL -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="62" height="62" rx="10" fill="url(#panelBox)" stroke="#334155" stroke-width="1" />
        <!-- Sparkle star -->
        <path d="M 31 16 L 33 24 L 41 26 L 33 28 L 31 36 L 29 28 L 21 26 L 29 24 Z" fill="#94A3B8" />
        <text x="31" y="49" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="8" font-weight="bold">SPECIAL</text>
      </g>

      <!-- 2. SCALP (Selected - Cyan Highlight) -->
      <g transform="translate(70, 38)">
        <rect x="0" y="0" width="62" height="62" rx="10" fill="url(#cyanGlow)" filter="url(#softGlow)" />
        <!-- Head / Scalp Silhouette -->
        <circle cx="31" cy="24" r="8" fill="none" stroke="#FFFFFF" stroke-width="2" />
        <path d="M 23 37 C 23 31, 39 31, 39 37" fill="none" stroke="#FFFFFF" stroke-width="2" />
        <text x="31" y="50" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="8.5" font-weight="bold">SCALP</text>
      </g>

      <!-- 3. FACE & NECK -->
      <g transform="translate(0, 108)">
        <rect x="0" y="0" width="62" height="62" rx="10" fill="url(#panelBox)" stroke="#334155" stroke-width="1" />
        <circle cx="31" cy="25" r="9" fill="none" stroke="#64748B" stroke-width="1.8" />
        <text x="31" y="49" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="7.5" font-weight="bold">FACE &amp; NECK</text>
      </g>

      <!-- 4. BODY -->
      <g transform="translate(70, 108)">
        <rect x="0" y="0" width="62" height="62" rx="10" fill="url(#panelBox)" stroke="#334155" stroke-width="1" />
        <path d="M 20 20 C 26 28, 36 28, 42 20" fill="none" stroke="#64748B" stroke-width="1.8" />
        <text x="31" y="49" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="8" font-weight="bold">BODY</text>
      </g>
    </g>

    <!-- RIGHT PANEL: Parameters (Shot/Second & Intensity) -->
    <g transform="translate(485, 275)">
      <rect x="0" y="0" width="295" height="170" rx="14" fill="#17202D" stroke="#263345" stroke-width="1" />

      <!-- Row 1: Shot / Second -->
      <g transform="translate(15, 20)">
        <!-- Pulse icon -->
        <path d="M 0 16 L 8 16 L 12 6 L 16 26 L 20 12 L 24 18 L 30 18" fill="none" stroke="#94A3B8" stroke-width="1.8" />
        <text x="38" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">Shot / Second</text>

        <!-- Value Box: 5 -->
        <rect x="135" y="0" width="64" height="32" rx="6" fill="url(#blueBox)" />
        <text x="167" y="22" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold">5</text>
        <text x="206" y="21" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="bold">HZ</text>

        <!-- Up / Down Carats -->
        <path d="M 245 10 L 251 4 L 257 10" fill="none" stroke="#94A3B8" stroke-width="2" />
        <path d="M 245 22 L 251 28 L 257 22" fill="none" stroke="#94A3B8" stroke-width="2" />
      </g>

      <!-- Row 2: Intensity -->
      <g transform="translate(15, 75)">
        <!-- Bar chart icon -->
        <rect x="4" y="16" width="4" height="8" fill="#94A3B8" />
        <rect x="11" y="12" width="4" height="12" fill="#94A3B8" />
        <rect x="18" y="8" width="4" height="16" fill="#94A3B8" />
        <text x="38" y="18" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">Intensity</text>

        <!-- Value Box: 8 -->
        <rect x="135" y="0" width="64" height="32" rx="6" fill="url(#blueBox)" />
        <text x="167" y="22" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="20" font-weight="bold">8</text>

        <!-- Up / Down Carats -->
        <path d="M 245 10 L 251 4 L 257 10" fill="none" stroke="#94A3B8" stroke-width="2" />
        <path d="M 245 22 L 251 28 L 257 22" fill="none" stroke="#94A3B8" stroke-width="2" />
      </g>
    </g>

    <!-- BOTTOM SCREEN CONTROLS -->
    <g transform="translate(325, 475)">
      <!-- Save button -->
      <g transform="translate(0, 0)">
        <path d="M 10 2 L 10 12 M 6 8 L 10 12 L 14 8 M 4 15 L 16 15" fill="none" stroke="#64748B" stroke-width="1.5" />
        <text x="10" y="26" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="7.5" font-weight="bold">SAVE</text>
      </g>

      <!-- 1 ~ 5 Memory Buttons -->
      <g transform="translate(45, 0)">
        <text x="0" y="12" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">1</text>
        <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="7.5">Memory</text>
      </g>
      <g transform="translate(90, 0)">
        <text x="0" y="12" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">2</text>
        <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="7.5">Memory</text>
      </g>
      <g transform="translate(135, 0)">
        <text x="0" y="12" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">3</text>
        <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="7.5">Memory</text>
      </g>
      <g transform="translate(180, 0)">
        <text x="0" y="12" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">4</text>
        <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="7.5">Memory</text>
      </g>
      <g transform="translate(225, 0)">
        <text x="0" y="12" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="bold">5</text>
        <text x="0" y="24" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="7.5">Memory</text>
      </g>

      <!-- SHOT COUNT: 0 -->
      <g transform="translate(295, 0)">
        <text x="0" y="10" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold">SHOT</text>
        <text x="0" y="21" fill="#94A3B8" font-family="sans-serif" font-size="8.5" font-weight="bold">COUNT</text>
        <rect x="45" y="-3" width="55" height="28" rx="6" fill="url(#blueBox)" opacity="0.85" />
        <text x="72" y="16" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">0</text>
      </g>

      <!-- START BUTTON -->
      <g transform="translate(425, 0)">
        <polygon points="12,0 26,10 12,20" fill="#00E5D2" filter="url(#softGlow)" />
        <text x="19" y="30" text-anchor="middle" fill="#00E5D2" font-family="sans-serif" font-size="8.5" font-weight="bold">START</text>
      </g>
    </g>
  </g>

  <!-- === 3. FRONT CONSOLE BRANDING & METALLIC POWER BUTTON === -->
  <g transform="translate(380, 580)">
    <!-- [sumi] logo box -->
    <rect x="0" y="0" width="80" height="44" rx="9" fill="none" stroke="#262626" stroke-width="3.5" />
    <text x="40" y="31" text-anchor="middle" fill="#262626" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" letter-spacing="-0.03em">sumi</text>

    <!-- THE CELLJET wordmark -->
    <text x="100" y="32" fill="#1E293B" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" letter-spacing="0.06em">THE CELLJET</text>
  </g>

  <!-- Metallic Illuminated Power Button -->
  <g transform="translate(740, 602)">
    <circle cx="0" cy="0" r="28" fill="url(#metallicBtn)" stroke="#CBD5E1" stroke-width="1.5" />
    <circle cx="0" cy="0" r="22" fill="#1E293B" />
    <circle cx="0" cy="0" r="18" fill="#0F172A" />
    <!-- Power Icon with Cyan Glow -->
    <path d="M -10 -5 A 12 12 0 1 0 10 -5" fill="none" stroke="#00E5D2" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />
    <line x1="0" y1="-14" x2="0" y2="-3" stroke="#00E5D2" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" />
  </g>

  <!-- Bottom Accent Groove & Core Text -->
  <line x1="255" y1="695" x2="845" y2="695" stroke="#CBD5E1" stroke-width="2" />
  <text x="760" y="715" text-anchor="end" fill="#475569" font-family="sans-serif" font-size="10.5" font-weight="bold" font-style="italic">Engineered with MUTO Impact Core V.3.4</text>

  <!-- === 4. ERGONOMIC APPLICATOR HANDPIECE & CABLE === -->
  <g id="handpiece" filter="url(#dropShadow)">
    <!-- Holster Mount on Right Side -->
    <path d="M 840 400 C 870 400, 875 420, 875 470 L 850 490 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />

    <!-- Handpiece Body Wand (Ergonomic White Curvature) -->
    <g transform="translate(870, 200)">
      <!-- Upper Nozzle / Wand Head -->
      <path d="M 70 0 C 85 0, 95 15, 95 30 L 95 80 C 95 180, 75 240, 65 310 C 60 345, 75 380, 80 400 L 40 400 C 35 370, 30 330, 25 290 C 15 220, 10 120, 20 60 C 25 20, 45 0, 70 0 Z"
            fill="url(#bodyGrad)" stroke="#BCC7D5" stroke-width="2" />

      <!-- Grip Vents / Detail Lines on Top -->
      <line x1="55" y1="30" x2="65" y2="65" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
      <line x1="65" y1="30" x2="75" y2="65" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
      <line x1="75" y1="30" x2="85" y2="65" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

      <!-- Side Seams & Ergonomic Notch -->
      <path d="M 45 100 C 50 140, 50 200, 45 250" fill="none" stroke="#CBD5E1" stroke-width="2" />
      <circle cx="55" cy="205" r="3.5" fill="#94A3B8" />

      <!-- Ribbed Strain Relief Boot (Bottom of Wand) -->
      <g transform="translate(48, 380)">
        <rect x="0" y="0" width="28" height="8" rx="3" fill="#94A3B8" />
        <rect x="2" y="8" width="24" height="8" rx="3" fill="#64748B" />
        <rect x="4" y="16" width="20" height="8" rx="3" fill="#94A3B8" />
        <rect x="6" y="24" width="16" height="8" rx="3" fill="#64748B" />
        <rect x="7" y="32" width="14" height="12" rx="4" fill="#334155" />
      </g>

      <!-- Black High-Pressure Braided Cable Extending Downward -->
      <path d="M 62 424 C 62 480, 80 540, 120 620 L 150 700" fill="none" stroke="#1E293B" stroke-width="16" stroke-linecap="round" />
      <path d="M 62 424 C 62 480, 80 540, 120 620 L 150 700" fill="none" stroke="#334155" stroke-width="12" stroke-linecap="round" />
      <path d="M 62 424 C 62 480, 80 540, 120 620 L 150 700" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />
    </g>
  </g>
</svg>